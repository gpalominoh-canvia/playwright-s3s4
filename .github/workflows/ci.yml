name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 11 * * 1-5' # lunes a viernes, 06:00 de Lima (11:00 UTC)
  workflow_dispatch:
    inputs:
      tags:
        description: 'Expresión de etiquetas (vacío = regresión completa)'
        required: false
        default: ''

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: typecheck + cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Revisar tipos
        run: npm run typecheck

      # Pull Request: solo @smoke (rápido). Push, schedule y manual: regresión completa.
      # Los @bug quedan fuera siempre: el perfil por defecto de cucumber.js los excluye.
      - name: Ejecutar escenarios
        env:
          TAGS: ${{ github.event_name == 'pull_request' && '@smoke' || inputs.tags }}
        run: |
          if [ -n "$TAGS" ]; then
            echo "Etiquetas: $TAGS"
            npm test -- --tags "$TAGS"
          else
            echo "Regresión completa"
            npm test
          fi
      - name: Resumen en el job y en el Pull Request
        if: always()
        run: node scripts/resumen-junit.mjs reports/cucumber-report.xml

      - name: Subir reporte, capturas y trazas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cucumber
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preparar el sitio del reporte
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p sitio
          cp reports/cucumber-report.html sitio/index.html

      - name: Subir el sitio para GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio/

  publicar:
    name: publicar reporte en GitHub Pages
    needs: pruebas
    # También cuando las pruebas fallan: el reporte rojo es justo el que hay que mirar.
    if: always() && github.event_name != 'pull_request' && needs.pruebas.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
